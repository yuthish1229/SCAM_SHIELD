<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScamShield</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            padding: 40px 20px;
        }

        .container {
            max-width: 550px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0002;
        }

        h1 { color: #3730a3; }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            box-sizing: border-box;
            margin: 15px 0;
        }

        button {
            background: #4338ca;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        #result { margin-top: 20px; }
    </style>
</head>

<body>
    <div class="container">
        <h1>🛡️ ScamShield</h1>
        <p>Check a message for common scam warning signs.</p>

        <textarea id="message"
            placeholder="Paste your message here..."></textarea>

        <button onclick="checkMessage()">Check Message</button>

        <div id="result"></div>
    </div>

    <script>
        async function checkMessage() {
            const message = document.getElementById("message").value;
            const result = document.getElementById("result");

            if (!message.trim()) {
                result.textContent = "Please enter a message.";
                return;
            }

            try {
                const response = await fetch("/check-scam", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();

                result.replaceChildren();

                const heading = document.createElement("h3");
                heading.textContent = data.risk;
                result.appendChild(heading);

                const details = document.createElement("p");
                details.textContent = data.warnings.length
                    ? "Warning signs: " + data.warnings.join(", ")
                    : "No configured warning keywords found.";
                result.appendChild(details);

                const note = document.createElement("small");
                note.textContent =
                    "This basic checker cannot guarantee a message is safe.";
                result.appendChild(note);
            } catch {
                result.textContent = "Server error. Please try again.";
            }
        }
    </script>
</body>
</html>
